<ion-tabs>
  <ion-header slot="top" class="app-header">
    <ion-toolbar class="app-toolbar">
      <div class="app-logo" slot="start" role="img" aria-label="Meine Pfote">
        <ion-icon name="paw-outline" aria-hidden="true"></ion-icon>
      </div>
      <div
        class="connection-status"
        [class.online]="isOnline()"
        [class.offline]="!isOnline()"
        role="status"
        aria-live="polite"
        [attr.aria-label]="isOnline() ? 'Online' : 'Offline'"
        [title]="isOnline() ? 'Online' : 'Offline'"
      >
        <ion-icon [name]="isOnline() ? 'wifi-outline' : 'cloud-offline-outline'" aria-hidden="true"></ion-icon>
        <span>{{ isOnline() ? 'Online' : 'Offline' }}</span>
      </div>
      <ion-buttons slot="end">
        @if (currentUser) {
        <span class="current-user">{{ currentUser.firstName }} · {{ roleLabel }}</span>
        }
        <ion-button class="logout-button" fill="clear" (click)="logout()">Abmelden</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom">
    @for (item of navigation; track item.path) {
    <ion-tab-button
      [tab]="item.path"
      [routerLink]="'/home/' + item.path"
      routerLinkActive="tab-selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <ion-icon [name]="item.icon"></ion-icon>
      <ion-label>{{ item.label }}</ion-label>
      @if (item.path === 'notifications' && unreadNotificationCount > 0) {
      <ion-badge color="danger">{{ unreadNotificationCount }}</ion-badge>
      }
    </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
